name: Windows Release (manual, official parameters)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Telegram Desktop tag to compile, for example v7.0.1.
        required: true
        type: string
      environment:
        description: GitHub Environment containing API_ID and API_HASH secrets.
        required: true
        type: environment
      configuration:
        description: CMake configuration to build.
        required: true
        default: Release
        type: choice
        options:
          - Release
          - RelWithDebInfo
          - Debug
          - MinSizeRel

permissions:
  contents: read

concurrency:
  group: windows-release-official-${{ inputs.tag }}-${{ inputs.configuration }}
  cancel-in-progress: false

jobs:
  windows-release:
    name: Windows x64 ${{ inputs.configuration }}
    environment:
      name: ${{ inputs.environment }}
    runs-on: windows-latest
    timeout-minutes: 360

    defaults:
      run:
        shell: cmd

    env:
      TBUILD: ${{ github.workspace }}\TBuild
      TDESKTOP_SOURCE_DIR: ${{ github.workspace }}\TBuild\tdesktop
      TDESKTOP_RUNNER_DIR: ${{ github.workspace }}\TBuild\runner
      TDESKTOP_SOURCE_REF: ${{ startsWith(inputs.tag, 'refs/tags/') && inputs.tag || format('refs/tags/{0}', inputs.tag) }}
      TDESKTOP_ARCHITECTURE: x64
      TDESKTOP_CONFIGURATION: ${{ inputs.configuration }}
      TDESKTOP_QT_FLAVOR: default
      TDESKTOP_OFFICIAL_PARAMETERS: true
      TDESKTOP_CACHE_SCHEMA: v2
      TDESKTOP_GENERATOR: default
      TDESKTOP_USE_TEST_API: false
      TDESKTOP_ONLY_CACHE: false
      TDESKTOP_UPLOAD_ARTIFACT: true
      # The hosted runner currently ships a newer CMake than this tag was authored
      # against. Keep Telegram's configure.bat flow, but do not treat new CMake
      # policy diagnostics from bundled third-party projects as fatal errors.
      TDESKTOP_EXTRA_CMAKE_ARGS: "-Wno-error=policy"
      TDESKTOP_API_ID: ${{ secrets.TDESKTOP_API_ID || secrets.API_ID }}
      TDESKTOP_API_HASH: ${{ secrets.TDESKTOP_API_HASH || secrets.API_HASH }}

    steps:
      - name: Prepare BuildPath.
        run: |
          if not exist "%TBUILD%" mkdir "%TBUILD%"
          if not exist "%TBUILD%\Libraries" mkdir "%TBUILD%\Libraries"
          if not exist "%TBUILD%\ThirdParty" mkdir "%TBUILD%\ThirdParty"

      - name: Checkout build runner scripts.
        uses: actions/checkout@v4
        with:
          path: TBuild/runner

      - name: Checkout Telegram Desktop source.
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TDESKTOP_SOURCE_REF }}
          submodules: recursive
          fetch-depth: 0
          path: TBuild/tdesktop

      - name: Setup Python.
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Validate deployment API credentials.
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TDESKTOP_API_ID)) {
            throw "The selected environment does not provide TDESKTOP_API_ID or API_ID."
          }
          if ([string]::IsNullOrWhiteSpace($env:TDESKTOP_API_HASH)) {
            throw "The selected environment does not provide TDESKTOP_API_HASH or API_HASH."
          }
          Write-Output "::add-mask::$env:TDESKTOP_API_ID"
          Write-Output "::add-mask::$env:TDESKTOP_API_HASH"

      - name: Compute official build environment.
        run: |
          cd /d "%TDESKTOP_RUNNER_DIR%"
          python tools\build_windows.py github-env

      - name: Ensure VS2026 ATL/MFC components.
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installer = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\setup.exe"
          if (-not (Test-Path -LiteralPath $vswhere)) { throw 'vswhere.exe was not found.' }
          if (-not (Test-Path -LiteralPath $installer)) { throw 'Visual Studio Installer setup.exe was not found.' }

          $vsInstance = (& $vswhere -latest -version '[18.0,19.0)' -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -format json | ConvertFrom-Json) | Select-Object -First 1
          if (-not $vsInstance) { throw 'Visual Studio 2026 / VS 18 with x64 C++ tools was not found.' }

          $installPath = $vsInstance.installationPath
          $channelId = $vsInstance.channelId
          $productId = $vsInstance.productId
          if (-not $installPath) { throw 'Visual Studio 2026 / VS 18 with x64 C++ tools was not found.' }
          if (-not $channelId) { throw 'Visual Studio 2026 channelId was not reported by vswhere.' }
          if (-not $productId) { throw 'Visual Studio 2026 productId was not reported by vswhere.' }
          Write-Host "Visual Studio 2026: $installPath"
          Write-Host "Visual Studio channelId: $channelId"
          Write-Host "Visual Studio productId: $productId"

          function Get-VcToolsPath {
            $toolsRoot = Join-Path $installPath 'VC\Tools\MSVC'
            if (-not (Test-Path -LiteralPath $toolsRoot)) { return $null }
            Get-ChildItem -LiteralPath $toolsRoot -Directory |
              Where-Object { $_.Name.StartsWith($env:MSVC_TOOLSET) } |
              Sort-Object Name -Descending |
              Select-Object -First 1 -ExpandProperty FullName
          }

          function Test-AtlHeaders {
            $vcToolsPath = Get-VcToolsPath
            if (-not $vcToolsPath) { return $false }
            $includePath = Join-Path $vcToolsPath 'ATLMFC\include'
            return (Test-Path -LiteralPath (Join-Path $includePath 'atlbase.h')) -and
              (Test-Path -LiteralPath (Join-Path $includePath 'atlcomcli.h'))
          }

          if (Test-AtlHeaders) {
            Write-Host 'Required ATL/MFC headers are already installed.'
            return
          }

          Write-Host "Required ATL/MFC headers are missing. Adding VS2026 v14.44 ATL/MFC components."
          $components = @(
            'Microsoft.VisualStudio.Component.VC.14.44.17.14.ATL',
            'Microsoft.VisualStudio.Component.VC.14.44.17.14.MFC'
          )
          $installerArgs = @('modify', '--installPath', $installPath, '--productId', $productId, '--channelId', $channelId, '--quiet', '--norestart', '--nocache')
          foreach ($component in $components) { $installerArgs += @('--add', $component) }

          Write-Host "Installer: $installer"
          Write-Host "Arguments: $($installerArgs -join ' ')"
          $processInfo = [System.Diagnostics.ProcessStartInfo]::new()
          $processInfo.FileName = $installer
          $processInfo.UseShellExecute = $false
          foreach ($argument in $installerArgs) {
            [void]$processInfo.ArgumentList.Add($argument)
          }

          $process = [System.Diagnostics.Process]::Start($processInfo)
          $process.WaitForExit()
          if ($process.ExitCode -ne 0 -and $process.ExitCode -ne 3010) {
            Write-Host 'Recent Visual Studio Installer logs:'
            Get-ChildItem -Path $env:TEMP -Filter 'dd_setup_*.log' -File -ErrorAction SilentlyContinue |
              Sort-Object LastWriteTime -Descending |
              Select-Object -First 3 |
              ForEach-Object {
                Write-Host "---- tail: $($_.FullName) ----"
                Get-Content -LiteralPath $_.FullName -Tail 120 -ErrorAction SilentlyContinue
              }
            throw "Visual Studio Installer failed while adding ATL/MFC components. Exit code: $($process.ExitCode)."
          }

          if (-not (Test-AtlHeaders)) {
            throw 'ATL/MFC installation finished, but atlbase.h or atlcomcli.h is still missing.'
          }

          Write-Host 'Required ATL/MFC headers are installed.'

      - name: Native Tools Command Prompt.
        uses: Eden-CI/msvc-dev-cmd@1bd71f95d6f3d1b2b3395b335cc63bcdc90cf223
        with:
          arch: ${{ env.MSVC_ARCH }}
          sdk: ${{ env.SDK }}
          toolset: ${{ env.MSVC_TOOLSET }}
          vsversion: "2026"

      - name: Verify official Windows build environment.
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host "VSINSTALLDIR=$env:VSINSTALLDIR"
          Write-Host "VisualStudioVersion=$env:VisualStudioVersion"
          Write-Host "VCToolsVersion=$env:VCToolsVersion"
          Write-Host "VSCMD_ARG_VCVARS_VER=$env:VSCMD_ARG_VCVARS_VER"
          Write-Host "WindowsSDKVersion=$env:WindowsSDKVersion"

          if (-not $env:VSINSTALLDIR) {
            throw 'Native Visual Studio environment was not initialized.'
          }
          if ($env:VSINSTALLDIR -notmatch '\\Microsoft Visual Studio\\18\\') {
            throw "Official Windows build docs require Visual Studio 2026 / VS 18; selected VSINSTALLDIR is '$env:VSINSTALLDIR'."
          }
          if ($env:VSCMD_ARG_VCVARS_VER -ne $env:MSVC_TOOLSET) {
            throw "Expected vcvars toolset '$env:MSVC_TOOLSET', got '$env:VSCMD_ARG_VCVARS_VER'."
          }
          if (-not $env:VCToolsVersion -or -not $env:VCToolsVersion.StartsWith($env:MSVC_TOOLSET)) {
            throw "Expected MSVC tools '$env:MSVC_TOOLSET', got '$env:VCToolsVersion'."
          }
          if (-not $env:WindowsSDKVersion -or -not $env:WindowsSDKVersion.StartsWith($env:SDK)) {
            throw "Expected Windows SDK '$env:SDK', got '$env:WindowsSDKVersion'."
          }

          $cl = Get-Command cl.exe -ErrorAction Stop
          Write-Host "cl.exe=$($cl.Source)"

          $includeDirs = ($env:INCLUDE -split ';') | Where-Object { $_ }
          foreach ($header in @('atlbase.h', 'atlcomcli.h')) {
            $found = $includeDirs | Where-Object { Test-Path -LiteralPath (Join-Path $_ $header) } | Select-Object -First 1
            if (-not $found) {
              throw "Required ATL header '$header' was not found in INCLUDE. Breakpad requires ATL/MFC components."
            }
            Write-Host "$header=$found"
          }

      - name: NuGet sources.
        run: |
          nuget sources Disable -Name "Microsoft Visual Studio Offline Packages"
          nuget sources Add -Source https://api.nuget.org/v3/index.json & exit 0

      - name: Patch CMake MSVC debug flags.
        run: |
          cd /d "%TDESKTOP_RUNNER_DIR%"
          python tools\build_windows.py patch-cmake-msvc

      - name: Build tool diagnostics.
        run: |
          cd /d "%TDESKTOP_RUNNER_DIR%"
          python tools\build_windows.py diagnose

      - name: ThirdParty cache.
        id: cache-third-party
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.TDESKTOP_THIRD_PARTY_PATH }}
          key: ${{ runner.os }}-${{ runner.arch }}-tdesktop-third-party-${{ env.TDESKTOP_CACHE_SCHEMA }}-${{ env.TDESKTOP_CACHE_KEY }}

      - name: Libraries cache.
        id: cache-libs
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ env.LibrariesPath }}\*
            !${{ env.LibrariesPath }}\cache_keys
            !${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\*
            !${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ runner.os }}-${{ env.TDESKTOP_ARCHITECTURE }}-tdesktop-libs-${{ env.TDESKTOP_CACHE_SCHEMA }}-${{ env.TDESKTOP_CACHE_KEY }}

      - name: Partial Libraries cache.
        id: cache-libs-partial
        if: steps.cache-libs.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ env.LibrariesPath }}\*
            !${{ env.LibrariesPath }}\cache_keys
            !${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\*
            !${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ runner.os }}-${{ env.TDESKTOP_ARCHITECTURE }}-tdesktop-libs-partial-${{ env.TDESKTOP_CACHE_SCHEMA }}-${{ env.TDESKTOP_CACHE_KEY }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ runner.os }}-${{ env.TDESKTOP_ARCHITECTURE }}-tdesktop-libs-partial-${{ env.TDESKTOP_CACHE_SCHEMA }}-${{ env.TDESKTOP_CACHE_KEY }}-${{ github.run_id }}-
            ${{ runner.os }}-${{ env.TDESKTOP_ARCHITECTURE }}-tdesktop-libs-partial-${{ env.TDESKTOP_CACHE_SCHEMA }}-${{ env.TDESKTOP_CACHE_KEY }}-

      - name: Qt cache.
        id: cache-qt
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ runner.os }}-${{ env.TDESKTOP_ARCHITECTURE }}-default-tdesktop-qt-${{ env.TDESKTOP_CACHE_SCHEMA }}-${{ env.TDESKTOP_CACHE_KEY }}

      - name: Prepare libraries.
        id: prepare-libraries
        if: >-
          steps.cache-third-party.outputs.cache-hit != 'true' ||
          steps.cache-libs.outputs.cache-hit != 'true' ||
          steps.cache-qt.outputs.cache-hit != 'true'
        continue-on-error: true
        run: |
          cd /d "%TDESKTOP_RUNNER_DIR%"
          python tools\build_windows.py prepare

      - name: Diagnose failed dependency preparation.
        if: steps.prepare-libraries.outcome == 'failure'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          Write-Host 'Prepare libraries failed. Printing focused dependency diagnostics.'

          $libraries = $env:LibrariesPath
          Write-Host "LibrariesPath=$libraries"
          if (-not (Test-Path -LiteralPath $libraries)) {
            Write-Host 'LibrariesPath does not exist.'
            return
          }

          $checks = @(
            'libvpx',
            'libvpx\config.log',
            'libvpx\vpx.sln',
            'libvpx\vpx.vcxproj',
            'libvpx\x64\Release\vpxmt.lib',
            'local\lib\vpxmt.lib',
            'cache_keys\libvpx',
            'cache_keys\libvpx-*'
          )

          foreach ($relative in $checks) {
            $path = Join-Path $libraries $relative
            $items = Get-ChildItem -Path $path -Force -ErrorAction SilentlyContinue
            if ($items) {
              Write-Host "FOUND: $relative"
              $items | Select-Object -First 20 FullName, Length, LastWriteTime | Format-Table -AutoSize | Out-String -Width 240 | Write-Host
            } elseif (Test-Path -LiteralPath $path) {
              $item = Get-Item -LiteralPath $path -Force
              Write-Host "FOUND: $relative -> $($item.FullName)"
            } else {
              Write-Host "MISSING: $relative"
            }
          }

          Write-Host 'Recently modified libvpx diagnostic files:'
          Get-ChildItem -LiteralPath $libraries -Recurse -Force -File -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match 'libvpx' -and $_.Extension -in '.log', '.err', '.out', '.txt', '.mk', '.tlog' } |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 20 FullName, Length, LastWriteTime |
            Format-Table -AutoSize | Out-String -Width 240 | Write-Host

          Get-ChildItem -LiteralPath $libraries -Recurse -Force -File -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match 'libvpx' -and $_.Extension -in '.log', '.err', '.out', '.txt' } |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 5 |
            ForEach-Object {
              Write-Host "---- tail: $($_.FullName) ----"
              Get-Content -LiteralPath $_.FullName -Tail 120 -ErrorAction SilentlyContinue
            }

      - name: Save ThirdParty cache.
        if: steps.prepare-libraries.outcome == 'success' && steps.cache-third-party.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.TDESKTOP_THIRD_PARTY_PATH }}
          key: ${{ runner.os }}-${{ runner.arch }}-tdesktop-third-party-${{ env.TDESKTOP_CACHE_SCHEMA }}-${{ env.TDESKTOP_CACHE_KEY }}

      - name: Save Libraries cache.
        if: steps.prepare-libraries.outcome == 'success' && steps.cache-libs.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ env.LibrariesPath }}\*
            !${{ env.LibrariesPath }}\cache_keys
            !${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\*
            !${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ runner.os }}-${{ env.TDESKTOP_ARCHITECTURE }}-tdesktop-libs-${{ env.TDESKTOP_CACHE_SCHEMA }}-${{ env.TDESKTOP_CACHE_KEY }}

      - name: Save Qt cache.
        if: steps.prepare-libraries.outcome == 'success' && steps.cache-qt.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ runner.os }}-${{ env.TDESKTOP_ARCHITECTURE }}-default-tdesktop-qt-${{ env.TDESKTOP_CACHE_SCHEMA }}-${{ env.TDESKTOP_CACHE_KEY }}

      - name: Save partial Libraries cache.
        if: steps.prepare-libraries.outcome == 'failure'
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ env.LibrariesPath }}\*
            !${{ env.LibrariesPath }}\cache_keys
            !${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\*
            !${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ runner.os }}-${{ env.TDESKTOP_ARCHITECTURE }}-tdesktop-libs-partial-${{ env.TDESKTOP_CACHE_SCHEMA }}-${{ env.TDESKTOP_CACHE_KEY }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Free up disk space after dependency preparation.
        if: always() && steps.prepare-libraries.outcome != 'skipped'
        shell: pwsh
        run: |
          $path = $env:LibrariesPath
          if (-not (Test-Path $path)) { return }
          Get-ChildItem -LiteralPath $path -Recurse -Force -File |
            Where-Object {
              $_.Extension -notin '.lib', '.a', '.exe', '.h', '.hpp', '.inc', '.cmake' -and
              $_.FullName -notmatch '\\include\\' -and
              $_.FullName -notmatch '\\objects-[^\\]+\\' -and
              $_.FullName -notmatch '\\cache_keys\\' -and
              $_.FullName -notmatch '\\patches\\'
            } |
            Remove-Item -Force
          Get-ChildItem -LiteralPath $path -Recurse -Force -Directory |
            Sort-Object FullName -Descending |
            Where-Object { -not (Get-ChildItem -LiteralPath $_.FullName -Force | Select-Object -First 1) } |
            Remove-Item -Force

      - name: Stop after failed dependency preparation.
        if: steps.prepare-libraries.outcome == 'failure'
        run: exit /b 1

      - name: Telegram Desktop build.
        run: |
          cd /d "%TDESKTOP_RUNNER_DIR%"
          python tools\build_windows.py build

      - name: Stage artifact.
        run: |
          cd /d "%TDESKTOP_RUNNER_DIR%"
          python tools\build_windows.py artifact

      - name: Upload artifact.
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.TDESKTOP_ARTIFACT_NAME }}
          path: ${{ env.TDESKTOP_ARTIFACT_DIR }}
          if-no-files-found: error
