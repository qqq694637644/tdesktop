name: Windows Release (manual, official parameters)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Telegram Desktop tag to compile, for example v7.0.1.
        required: true
        type: string
      environment:
        description: GitHub Environment containing API_ID and API_HASH secrets.
        required: true
        type: environment
      architecture:
        description: Windows target architecture.
        required: true
        default: x64
        type: choice
        options:
          - x64
          - x86
          - arm64
      configuration:
        description: CMake configuration to build.
        required: true
        default: Release
        type: choice
        options:
          - Release
          - Debug
      qt:
        description: Qt dependency flavor. Default matches the official documented build command.
        required: true
        default: default
        type: choice
        options:
          - default
          - qt6
      generator:
        description: CMake generator. Default follows configure.bat and Visual Studio.
        required: true
        default: default
        type: choice
        options:
          - default
          - Ninja Multi-Config
      upload_artifact:
        description: Upload Telegram.exe and Updater.exe after a successful build.
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: windows-release-${{ inputs.tag }}-${{ inputs.architecture }}-${{ inputs.configuration }}-${{ inputs.qt }}-${{ inputs.generator }}
  cancel-in-progress: false

jobs:
  windows-release:
    name: Windows ${{ inputs.architecture }} ${{ inputs.configuration }}
    environment:
      name: ${{ inputs.environment }}
    runs-on: ${{ inputs.architecture == 'arm64' && 'windows-11-arm' || 'windows-latest' }}
    timeout-minutes: 720

    defaults:
      run:
        shell: cmd

    env:
      UPLOAD_ARTIFACT: ${{ inputs.upload_artifact }}
      ONLY_CACHE: "false"
      PREPARE_PATH: Telegram/build/prepare/prepare.py
      SOURCE_REF: ${{ startsWith(inputs.tag, 'refs/tags/') && inputs.tag || format('refs/tags/{0}', inputs.tag) }}
      API_ID: ${{ secrets.API_ID }}
      API_HASH: ${{ secrets.API_HASH }}

    steps:
      - name: Prepare directories.
        run: |
          mkdir %userprofile%\TBuild\Libraries
          mklink /d %GITHUB_WORKSPACE%\TBuild %userprofile%\TBuild
          echo TBUILD=%GITHUB_WORKSPACE%\TBuild>>%GITHUB_ENV%
          echo LibrariesPath=%GITHUB_WORKSPACE%\TBuild\Libraries${{ inputs.architecture == 'x64' && '\win64' || '' }}>>%GITHUB_ENV%

      - name: Get repository name.
        shell: bash
        run: echo "REPO_NAME=${GITHUB_REPOSITORY##*/}" >> "$GITHUB_ENV"

      - name: Clone.
        uses: actions/checkout@v7
        with:
          ref: ${{ env.SOURCE_REF }}
          submodules: recursive
          fetch-depth: 0
          path: ${{ env.TBUILD }}\${{ env.REPO_NAME }}

      - name: Validate deployment API credentials.
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:API_ID)) {
            throw "The selected environment does not provide the API_ID secret."
          }
          if ([string]::IsNullOrWhiteSpace($env:API_HASH)) {
            throw "The selected environment does not provide the API_HASH secret."
          }
          Write-Output "::add-mask::$env:API_ID"
          Write-Output "::add-mask::$env:API_HASH"

      - name: First set up.
        shell: bash
        run: |
          DOCPATH="$TBUILD/$REPO_NAME/docs/building-win.md"
          SDK="$(grep "SDK version" "$DOCPATH" | sed -r 's/.*\*\*(.*)\*\* SDK version.*/\1/')"
          echo "SDK=$SDK" >> "$GITHUB_ENV"

          sed -i '/CMAKE_${lang}_FLAGS_DEBUG_INIT/s/${_Zi}//' "$PROGRAMFILES"/CMake/share/cmake*/Modules/Platform/Windows-MSVC.cmake

          echo "$(sha256sum "$TBUILD/$REPO_NAME/$PREPARE_PATH" | awk '{ print $1 }')" >> CACHE_KEY.txt
          echo "$SDK" >> CACHE_KEY.txt
          echo "${{ inputs.architecture }}" >> CACHE_KEY.txt
          echo "${{ inputs.configuration }}" >> CACHE_KEY.txt
          echo "${{ inputs.qt }}" >> CACHE_KEY.txt
          echo "CACHE_KEY=$(sha256sum CACHE_KEY.txt | awk '{ print $1 }')" >> "$GITHUB_ENV"

          echo "Configure git for dependency cherry-picks."
          git config --global user.email "you@example.com"
          git config --global user.name "Sample"

      - name: Install VS 2026 Build Tools.
        if: inputs.architecture == 'arm64'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://aka.ms/vs/18/stable/vs_buildtools.exe -OutFile vs_buildtools.exe
          $p = Start-Process -FilePath .\vs_buildtools.exe -Wait -PassThru -ArgumentList `
            '--quiet','--wait','--norestart','--nocache', `
            '--add','Microsoft.VisualStudio.Workload.VCTools', `
            '--add','Microsoft.VisualStudio.Component.VC.Tools.ARM64', `
            '--add','Microsoft.VisualStudio.Component.VC.ATL.ARM64'
          Remove-Item vs_buildtools.exe -Force
          if ($p.ExitCode -ne 0 -and $p.ExitCode -ne 3010) { exit $p.ExitCode }

      - uses: Eden-CI/msvc-dev-cmd@master
        name: Native Tools Command Prompt.
        if: inputs.architecture != 'arm64'
        with:
          arch: ${{ inputs.architecture == 'x86' && 'x64_x86' || 'x64' }}
          sdk: ${{ env.SDK }}
          toolset: 14.44

      - uses: Eden-CI/msvc-dev-cmd@master
        name: Native Tools Command Prompt ARM64.
        if: inputs.architecture == 'arm64'
        with:
          arch: arm64
          sdk: ${{ env.SDK }}

      - name: NuGet sources.
        run: |
          nuget sources Disable -Name "Microsoft Visual Studio Offline Packages"
          nuget sources Add -Source https://api.nuget.org/v3/index.json & exit 0

      - name: ThirdParty cache.
        id: cache-third-party
        uses: actions/cache@v6
        with:
          path: ${{ env.TBUILD }}\ThirdParty
          key: ${{ runner.OS }}-${{ runner.arch }}-third-party-${{ env.CACHE_KEY }}
          restore-keys: ${{ runner.OS }}-${{ runner.arch }}-third-party-

      - name: Libraries cache.
        id: cache-libs
        uses: actions/cache@v6
        with:
          path: |
            ${{ env.LibrariesPath }}\*
            !${{ env.LibrariesPath }}\cache_keys
            !${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\*
            !${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ runner.OS }}-${{ inputs.architecture }}-libs-${{ env.CACHE_KEY }}
          restore-keys: ${{ runner.OS }}-${{ inputs.architecture }}-libs-

      - name: Qt cache.
        id: cache-qt
        uses: actions/cache@v6
        with:
          path: |
            ${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ runner.OS }}-${{ inputs.architecture }}-${{ inputs.qt }}-${{ env.CACHE_KEY }}
          restore-keys: ${{ runner.OS }}-${{ inputs.architecture }}-${{ inputs.qt }}-

      - name: Libraries.
        run: |
          %TBUILD%\%REPO_NAME%\Telegram\build\prepare\win.bat ${{ inputs.configuration == 'Debug' && 'skip-release silent' || 'silent' }} ${{ inputs.qt == 'qt6' && 'qt6' || '' }}

      - name: Read build parameters.
        shell: bash
        run: |
          ARTIFACT_NAME="Telegram-${{ inputs.architecture }}-${{ inputs.configuration }}"
          ARCH="${{ inputs.architecture }}"
          QT="${{ inputs.qt == 'qt6' && 'qt6' || '' }}"
          GENERATOR=""

          case "$ARCH" in
            x86) ARCH="x86";;
            x64) ARCH="x64";;
            arm64) ARCH="arm";;
          esac

          if [ "${{ inputs.generator }}" = "Ninja Multi-Config" ]; then
            GENERATOR='-G "Ninja Multi-Config"'
            ARCH=""
            ARTIFACT_NAME="$ARTIFACT_NAME-Ninja-Multi-Config"
          fi

          if [ -n "$QT" ]; then
            ARTIFACT_NAME="$ARTIFACT_NAME-$QT"
          fi

          echo "TDESKTOP_BUILD_GENERATOR=$GENERATOR" >> "$GITHUB_ENV"
          echo "TDESKTOP_BUILD_ARCH=$ARCH" >> "$GITHUB_ENV"
          echo "TDESKTOP_BUILD_QT=$QT" >> "$GITHUB_ENV"
          echo "TDESKTOP_BUILD_API=-D TDESKTOP_API_ID=$API_ID -D TDESKTOP_API_HASH=$API_HASH" >> "$GITHUB_ENV"
          echo "ARTIFACT_NAME=$ARTIFACT_NAME" >> "$GITHUB_ENV"

      - name: Free up some disk space.
        shell: bash
        run: find "$LibrariesPath" '(' '(' ! '(' -name '*.lib' -o -name '*.a' -o -name '*.exe' -o -name '*.h' -o -name '*.hpp' -o -name '*.inc' -o -name '*.cmake' -o -path '*/include/*' -o -path '*/objects-*' -o -path '*/cache_keys/*' -o -path '*/patches/*' ')' -type f ')' -o -empty ')' -delete

      - name: Telegram Desktop build.
        if: env.ONLY_CACHE == 'false'
        run: |
          cd %TBUILD%\%REPO_NAME%\Telegram

          call configure.bat ^
          %TDESKTOP_BUILD_GENERATOR% ^
          %TDESKTOP_BUILD_ARCH% ^
          %TDESKTOP_BUILD_QT% ^
          %TDESKTOP_BUILD_API% ^
          -D CMAKE_CONFIGURATION_TYPES=${{ inputs.configuration }} ^
          -D CMAKE_COMPILE_WARNING_AS_ERROR=ON ^
          -D CMAKE_MSVC_DEBUG_INFORMATION_FORMAT= ^
          -D DESKTOP_APP_DISABLE_AUTOUPDATE=OFF ^
          -D DESKTOP_APP_DISABLE_CRASH_REPORTS=OFF

          cmake --build ..\out --config ${{ inputs.configuration }} --parallel

      - name: Move artifact.
        if: env.UPLOAD_ARTIFACT == 'true'
        run: |
          set OUT=%TBUILD%\%REPO_NAME%\out\${{ inputs.configuration }}
          mkdir artifact
          move %OUT%\Telegram.exe artifact\
          move %OUT%\Updater.exe artifact\

      - uses: actions/upload-artifact@v7
        name: Upload artifact.
        if: env.UPLOAD_ARTIFACT == 'true'
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: artifact\
          if-no-files-found: error
