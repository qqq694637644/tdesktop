name: Windows Release (manual, official parameters)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Telegram Desktop tag to compile, for example v7.0.1.
        required: true
        type: string
      environment:
        description: GitHub Environment containing API_ID and API_HASH secrets.
        required: true
        type: environment
      configuration:
        description: CMake configuration to build.
        required: true
        default: Release
        type: choice
        options:
          - Release
          - Debug
          - MinSizeRel

permissions:
  contents: read

concurrency:
  group: windows-release-official-${{ inputs.tag }}-${{ inputs.configuration }}
  cancel-in-progress: false

jobs:
  windows-release:
    name: Windows x64 ${{ inputs.configuration }}
    environment:
      name: ${{ inputs.environment }}
    runs-on: windows-latest
    timeout-minutes: 360

    defaults:
      run:
        shell: cmd

    env:
      TBUILD: ${{ github.workspace }}\TBuild
      TDESKTOP_SOURCE_DIR: ${{ github.workspace }}\TBuild\tdesktop
      TDESKTOP_RUNNER_DIR: ${{ github.workspace }}\TBuild\runner
      TDESKTOP_SOURCE_REF: ${{ startsWith(inputs.tag, 'refs/tags/') && inputs.tag || format('refs/tags/{0}', inputs.tag) }}
      TDESKTOP_ARCHITECTURE: x64
      TDESKTOP_CONFIGURATION: ${{ inputs.configuration }}
      TDESKTOP_QT_FLAVOR: default
      TDESKTOP_OFFICIAL_PARAMETERS: true
      TDESKTOP_GENERATOR: default
      TDESKTOP_USE_TEST_API: false
      TDESKTOP_ONLY_CACHE: false
      TDESKTOP_UPLOAD_ARTIFACT: true
      TDESKTOP_EXTRA_CMAKE_ARGS: ""
      TDESKTOP_API_ID: ${{ secrets.TDESKTOP_API_ID || secrets.API_ID }}
      TDESKTOP_API_HASH: ${{ secrets.TDESKTOP_API_HASH || secrets.API_HASH }}

    steps:
      - name: Prepare directories.
        run: |
          mkdir %userprofile%\TBuild\Libraries
          mklink /d %GITHUB_WORKSPACE%\TBuild %userprofile%\TBuild
          echo TBUILD=%GITHUB_WORKSPACE%\TBuild>>%GITHUB_ENV%
          echo LibrariesPath=%GITHUB_WORKSPACE%\TBuild\Libraries${{ inputs.architecture == 'x64' && '\win64' || '' }}>>%GITHUB_ENV%

      - name: Get repository name.
        shell: bash
        run: echo "REPO_NAME=${GITHUB_REPOSITORY##*/}" >> "$GITHUB_ENV"

      - name: Clone.
        uses: actions/checkout@v7
        with:
          ref: ${{ env.SOURCE_REF }}
          submodules: recursive
          fetch-depth: 0
          path: ${{ env.TBUILD }}\${{ env.REPO_NAME }}

      - name: Validate deployment API credentials.
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:API_ID)) {
            throw "The selected environment does not provide the API_ID secret."
          }
          if ([string]::IsNullOrWhiteSpace($env:API_HASH)) {
            throw "The selected environment does not provide the API_HASH secret."
          }
          Write-Output "::add-mask::$env:API_ID"
          Write-Output "::add-mask::$env:API_HASH"

      - name: Compute official build environment.
        run: |
          DOCPATH="$TBUILD/$REPO_NAME/docs/building-win.md"
          SDK="$(grep "SDK version" "$DOCPATH" | sed -r 's/.*\*\*(.*)\*\* SDK version.*/\1/')"
          echo "SDK=$SDK" >> "$GITHUB_ENV"

          sed -i '/CMAKE_${lang}_FLAGS_DEBUG_INIT/s/${_Zi}//' "$PROGRAMFILES"/CMake/share/cmake*/Modules/Platform/Windows-MSVC.cmake

      - name: Ensure official VS 2026 x64 components.
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vs_installer.exe"
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installPath = ""
          if (Test-Path $vswhere) {
            $installPath = (& $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath) | Select-Object -First 1
          }

          $components = @(
            'Microsoft.VisualStudio.Workload.VCTools',
            'Microsoft.VisualStudio.Component.VC.14.44.17.14.x86.x64',
            'Microsoft.VisualStudio.Component.VC.14.44.17.14.ATL',
            'Microsoft.VisualStudio.Component.VC.14.44.17.14.MFC',
            'Microsoft.VisualStudio.Component.Windows11SDK.26100'
          )

          if ($installPath -and (Test-Path $installer)) {
            Write-Host "Updating Visual Studio components at $installPath"
            $args = @('modify', '--installPath', $installPath, '--quiet', '--wait', '--norestart', '--nocache')
            foreach ($component in $components) { $args += @('--add', $component) }
            $p = Start-Process -FilePath $installer -ArgumentList $args -Wait -PassThru
          } else {
            Write-Host 'Installing Visual Studio 2026 Build Tools components.'
            Invoke-WebRequest -Uri https://aka.ms/vs/18/stable/vs_buildtools.exe -OutFile vs_buildtools.exe
            $args = @('--quiet', '--wait', '--norestart', '--nocache')
            foreach ($component in $components) { $args += @('--add', $component) }
            $p = Start-Process -FilePath .\vs_buildtools.exe -ArgumentList $args -Wait -PassThru
            Remove-Item vs_buildtools.exe -Force
          }

          if ($p.ExitCode -ne 0 -and $p.ExitCode -ne 3010) { exit $p.ExitCode }

      - name: Native Tools Command Prompt.
        uses: Eden-CI/msvc-dev-cmd@master
        with:
          arch: arm64
          sdk: ${{ env.SDK }}
          toolset: ${{ env.MSVC_TOOLSET }}

      - name: NuGet sources.
        run: |
          nuget sources Disable -Name "Microsoft Visual Studio Offline Packages"
          nuget sources Add -Source https://api.nuget.org/v3/index.json & exit 0

      - name: ThirdParty cache.
        id: cache-third-party
        uses: actions/cache@v6
        with:
          path: ${{ env.TBUILD }}\ThirdParty
          key: ${{ runner.OS }}-${{ runner.arch }}-third-party-${{ env.CACHE_KEY }}
          restore-keys: ${{ runner.OS }}-${{ runner.arch }}-third-party-

      - name: Libraries cache.
        id: cache-libs
        uses: actions/cache@v6
        with:
          path: |
            ${{ env.LibrariesPath }}\*
            !${{ env.LibrariesPath }}\cache_keys
            !${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\*
            !${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ runner.os }}-${{ env.TDESKTOP_ARCHITECTURE }}-tdesktop-libs-${{ env.TDESKTOP_CACHE_KEY }}
          restore-keys: ${{ runner.os }}-${{ env.TDESKTOP_ARCHITECTURE }}-tdesktop-libs-

      - name: Qt cache.
        id: cache-qt
        uses: actions/cache@v6
        with:
          path: |
            ${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ runner.os }}-${{ env.TDESKTOP_ARCHITECTURE }}-default-tdesktop-qt-${{ env.TDESKTOP_CACHE_KEY }}
          restore-keys: ${{ runner.os }}-${{ env.TDESKTOP_ARCHITECTURE }}-default-tdesktop-qt-

      - name: Libraries.
        run: |
          %TBUILD%\%REPO_NAME%\Telegram\build\prepare\win.bat ${{ inputs.configuration == 'Debug' && 'skip-release silent' || 'silent' }} ${{ inputs.qt == 'qt6' && 'qt6' || '' }}

      - name: Read build parameters.
        shell: bash
        run: |
          ARTIFACT_NAME="Telegram-${{ inputs.architecture }}-${{ inputs.configuration }}"
          ARCH="${{ inputs.architecture }}"
          QT="${{ inputs.qt == 'qt6' && 'qt6' || '' }}"
          GENERATOR=""

          case "$ARCH" in
            x86) ARCH="x86";;
            x64) ARCH="x64";;
            arm64) ARCH="arm";;
          esac

          if [ "${{ inputs.generator }}" = "Ninja Multi-Config" ]; then
            GENERATOR='-G "Ninja Multi-Config"'
            ARCH=""
            ARTIFACT_NAME="$ARTIFACT_NAME-Ninja-Multi-Config"
          fi

          if [ -n "$QT" ]; then
            ARTIFACT_NAME="$ARTIFACT_NAME-$QT"
          fi

          echo "TDESKTOP_BUILD_GENERATOR=$GENERATOR" >> "$GITHUB_ENV"
          echo "TDESKTOP_BUILD_ARCH=$ARCH" >> "$GITHUB_ENV"
          echo "TDESKTOP_BUILD_QT=$QT" >> "$GITHUB_ENV"
          echo "TDESKTOP_BUILD_API=-D TDESKTOP_API_ID=$API_ID -D TDESKTOP_API_HASH=$API_HASH" >> "$GITHUB_ENV"
          echo "ARTIFACT_NAME=$ARTIFACT_NAME" >> "$GITHUB_ENV"

      - name: Free up some disk space.
        shell: bash
        run: find "$LibrariesPath" '(' '(' ! '(' -name '*.lib' -o -name '*.a' -o -name '*.exe' -o -name '*.h' -o -name '*.hpp' -o -name '*.inc' -o -name '*.cmake' -o -path '*/include/*' -o -path '*/objects-*' -o -path '*/cache_keys/*' -o -path '*/patches/*' ')' -type f ')' -o -empty ')' -delete

      - name: Telegram Desktop build.
        run: |
          cd %TBUILD%\%REPO_NAME%\Telegram

          call configure.bat ^
          %TDESKTOP_BUILD_GENERATOR% ^
          %TDESKTOP_BUILD_ARCH% ^
          %TDESKTOP_BUILD_QT% ^
          %TDESKTOP_BUILD_API% ^
          -D CMAKE_CONFIGURATION_TYPES=${{ inputs.configuration }} ^
          -D CMAKE_COMPILE_WARNING_AS_ERROR=ON ^
          -D CMAKE_MSVC_DEBUG_INFORMATION_FORMAT= ^
          -D DESKTOP_APP_DISABLE_AUTOUPDATE=OFF ^
          -D DESKTOP_APP_DISABLE_CRASH_REPORTS=OFF

          cmake --build ..\out --config ${{ inputs.configuration }} --parallel

      - name: Stage artifact.
        run: |
          set OUT=%TBUILD%\%REPO_NAME%\out\${{ inputs.configuration }}
          mkdir artifact
          move %OUT%\Telegram.exe artifact\
          move %OUT%\Updater.exe artifact\

      - name: Upload artifact.
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: artifact\
          if-no-files-found: error
